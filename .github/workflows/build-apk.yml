name: Compiler APK Android KeoPass

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'extension/**'

permissions:
  contents: write

jobs:
  build-apk:
    name: Génération de l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Installation des dépendances
        run: npm install

      - name: Construction de l'application Web (Next.js export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qvfmfstwrkcerzlbemzb.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2Zm1mc3R3cmtjZXJ6bGJlbXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjE1NDksImV4cCI6MjEwNzYzNzU0OX0.-VCES2YX_FDjWct12sTgTaDtfqnqUfXfPcMS39UmRBs' }}

      - name: Initialisation du projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilation et Signature de l'APK Android
        working-directory: android
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$SIGNING_KEY" ]; then
            echo "🚀 Secrets de signature détectés : compilation Release officielle..."
            ./gradlew assembleRelease --stacktrace

            echo "🔑 Préparation du trousseau de clés..."
            echo "$SIGNING_KEY" | base64 -d > release.keystore

            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
            echo "Outil apksigner : $APKSIGNER"

            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            if [ ! -f "$UNSIGNED_APK" ]; then
              UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            fi

            ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
              echo "Alignement 4-byte de l'APK..."
              $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
              UNSIGNED_APK="aligned.apk"
            fi

            echo "✍️ Signature cryptographique avec apksigner (v1, v2, v3)..."
            $APKSIGNER sign \
              --ks release.keystore \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:${KEY_PASSWORD:-$KEY_STORE_PASSWORD}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out ../KeoPass.apk \
              "$UNSIGNED_APK"

            echo "🛡️ Validation de l'APK signé :"
            $APKSIGNER verify --verbose ../KeoPass.apk
            rm -f release.keystore aligned.apk
          else
            echo "⚠️ Secret SIGNING_KEY non configuré : compilation en mode Debug temporaire..."
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../KeoPass.apk
          fi

      - name: Publication de l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: keopass-android-apk
          path: KeoPass.apk
          if-no-files-found: error
          retention-days: 30

      - name: Création / Mise à jour de la Release GitHub avec l'APK direct
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-apk-latest
          name: "KeoPass Android APK (Dernière version)"
          body: |
            ### 📱 Téléchargement KeoPass pour Android
            Téléchargez le fichier `KeoPass.apk` ci-dessous directement sur votre smartphone pour installer l'application.
            - Signature cryptographique Release officielle (v1, v2, v3)
            - Chiffrement Zero-Knowledge AES-256
            - Synchronisation Supabase intégrée
            - Coffre-fort de mots de passe, cartes et notes
          files: |
            KeoPass.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
