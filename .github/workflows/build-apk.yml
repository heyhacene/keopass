name: Compiler APK Android KeoPass

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'extension/**'

jobs:
  build-apk:
    name: Génération de l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Installation des dépendances
        run: npm install

      - name: Construction de l'application Web (Next.js export)
        run: npm run build

      - name: Initialisation du projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilation de l'APK Android (Gradle)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publication de l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: keopass-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
